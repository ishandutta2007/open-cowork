<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1E1E1E" rx="10" ry="10" />
  <circle cx="20" cy="20" r="6" fill="#FF5F56" />
  <circle cx="40" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="20" r="6" fill="#27C93F" />
  
  <text x="20" y="60" font-family="Courier, monospace" font-size="14" fill="#A9B7C6">
    <tspan x="20" dy="1.2em" fill="#98C379">user></tspan> Organize my workspace by file type.
    <tspan x="20" dy="1.8em" fill="#61AFEF">agent></tspan> I'll help you with that. Plan:
    <tspan x="40" dy="1.2em" fill="#ABB2BF">1. List files in the directory.</tspan>
    <tspan x="40" dy="1.2em" fill="#ABB2BF">2. Create folders for 'Images', 'Docs', 'Code'.</tspan>
    <tspan x="40" dy="1.2em" fill="#ABB2BF">3. Move files to respective folders.</tspan>
    <tspan x="20" dy="1.8em" fill="#E06C75">system></tspan> Executing: mkdir Images Docs Code...
    <tspan x="20" dy="1.8em" fill="#98C379">agent></tspan> Done! Your workspace is now organized. ✨
  </text>
</svg>
